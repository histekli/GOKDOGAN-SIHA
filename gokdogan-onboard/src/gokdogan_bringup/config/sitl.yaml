# GÖKDOĞAN SITL config (x86 dev). Tüm eşik/kazanç burada — sihirli sayı yok (§2.10).
mission_fsm:
  ros__parameters:
    vehicle: "ArduCopter"          # Faz 1 bringup gate aracı (güvenilir GUIDED kalkış, K-04)
    takeoff_method: "guided_takeoff"
    guided_mode: "GUIDED"
    takeoff_alt_m: 15.0
    arm_timeout_s: 90.0        # arming servisi yavaş keşfediliyor (worker'da tek uzun bekleme)
    connect_timeout_s: 60.0
    publish_rate_hz: 1.0
    control_rate_hz: 2.0
    autostart: true                # SITL/CI: lifecycle configure→activate otomatik

aircraft_state:
  ros__parameters:
    publish_rate_hz: 20.0

target_selector:
  ros__parameters:
    rate_hz: 2.0
    w_mesafe: 0.40
    w_aci: 0.30
    w_gecmis: 0.20
    w_risk: 0.10
    d_ref_m: 1000.0

guidance:
  ros__parameters:
    kp: 0.042
    ki: 0.0008
    kd: 0.025
    phi_max_deg: 45.0
    theta_max_deg: 30.0
    phi_rate_deg_s: 20.0
    lpf_alpha: 0.3
    enter_d_m: 480.0
    exit_d_m: 520.0
    bbox_stale_s: 0.5
    control_rate_hz: 20.0

mission_link:
  ros__parameters:
    udp_port: 5005
    tcp_port: 5006
    vision_rate_hz: 20.0
    heartbeat_hz: 1.0
    heartbeat_timeout_s: 5.0
    schema_path: ""     # doldurulursa gelen mesajlar JSON Schema ile doğrulanır

mavros:
  ros__parameters:
    fcu_url: "tcp://127.0.0.1:5760"
    gcs_url: ""
    tgt_system: 1
    tgt_component: 1
    fcu_protocol: "v2.0"
    # Yalnız ihtiyaç duyulan eklentiler (endpoint patlamasını önler → CycloneDDS keşif sağlığı;
    # tüm ~64 eklenti yüklüyken /mavros/cmd/arming servisi keşfedilemiyordu). SAD §8.
    plugin_allowlist:
      - sys_status
      - sys_time
      - command
      - global_position
      - local_position
      - imu
      - setpoint_raw
      - rc_io
      - param
      - waypoint
      - battery
    # ⚠️ Faz 4 (guidance) için ATTITUDE/LOCAL_POSITION stream rate ≥50Hz ayarı buraya eklenecek (SAD §8).
