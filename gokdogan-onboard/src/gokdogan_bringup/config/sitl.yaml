# GÖKDOĞAN SITL config (x86 dev). Tüm eşik/kazanç burada — sihirli sayı yok (§2.10).
mission_fsm:
  ros__parameters:
    vehicle: "ArduCopter"          # Faz 1 bringup gate aracı (güvenilir GUIDED kalkış, K-04)
    takeoff_method: "guided_takeoff"
    guided_mode: "GUIDED"
    takeoff_alt_m: 15.0
    arm_timeout_s: 90.0        # arming servisi yavaş keşfediliyor (worker'da tek uzun bekleme)
    connect_timeout_s: 60.0
    publish_rate_hz: 1.0
    control_rate_hz: 2.0
    autostart: true                # SITL/CI: lifecycle configure→activate otomatik
    # Failsafe katman-2 (SAD §18). Katman-1 = ArduPilot native FS (FS_THR/FS_GCS/BATT — ⚠️ param).
    failsafe_enabled: true
    fs_rc_loss_s: 5.0              # RC linki kaybı → LAND (ArduPilot FS_THR ile eşli)
    fs_gcs_loss_s: 10.0           # RF/GCS telemetri kaybı → RTL (KTR)
    fs_gps_glitch_s: 2.0          # GPS/EKF bozulması → LAND (dead-reckoning)
    fs_batt_rtl_pct: 20.0        # batarya < %20 → RTL
    fs_rate_hz: 5.0
    watchdog_timeout_s: 3.0
    critical_nodes: ["aircraft_state"]

aircraft_state:
  ros__parameters:
    publish_rate_hz: 20.0

target_selector:
  ros__parameters:
    rate_hz: 2.0
    w_mesafe: 0.40
    w_aci: 0.30
    w_gecmis: 0.20
    w_risk: 0.10
    d_ref_m: 1000.0

guidance:
  ros__parameters:
    kp: 0.042
    ki: 0.0008
    kd: 0.025
    phi_max_deg: 45.0
    theta_max_deg: 30.0
    phi_rate_deg_s: 20.0
    lpf_alpha: 0.3
    enter_d_m: 480.0
    exit_d_m: 520.0
    bbox_stale_s: 0.5
    control_rate_hz: 20.0

hss:
  ros__parameters:
    k_att: 0.8
    k_rep: 15.0
    hss_margin_m: 40.0     # gerçek copter overshoot'una karşı geniş güvenlik (0 ihlal)
    v_max: 8.0
    lookahead_s: 1.5       # ince kontrol (aşımı azalt)
    control_rate_hz: 20.0

kamikaze:
  ros__parameters:
    timeout_s: 120.0

mission_link:
  ros__parameters:
    udp_port: 5005
    tcp_port: 5006
    vision_rate_hz: 20.0
    heartbeat_hz: 1.0
    heartbeat_timeout_s: 5.0
    schema_path: ""     # doldurulursa gelen mesajlar JSON Schema ile doğrulanır

video_streamer:
  ros__parameters:
    mode: "dev"                 # SITL/CI: kamerasız → videotestsrc
    source: "videotestsrc"
    width: 1280
    height: 720
    fps: 30
    bitrate_kbps: 2000
    rtsp_host: "0.0.0.0"
    rtsp_port: 8554
    rtsp_mount: "/gokdogan"

mavros:
  ros__parameters:
    fcu_url: "tcp://127.0.0.1:5760"
    gcs_url: ""
    tgt_system: 1
    tgt_component: 1
    fcu_protocol: "v2.0"
    # Yalnız ihtiyaç duyulan eklentiler (endpoint patlamasını önler → CycloneDDS keşif sağlığı;
    # tüm ~64 eklenti yüklüyken /mavros/cmd/arming servisi keşfedilemiyordu). SAD §8.
    plugin_allowlist:
      - sys_status
      - sys_time
      - command
      - global_position
      - local_position
      - imu
      - setpoint_raw
      - rc_io
      - param
      - waypoint
      - battery
    # ⚠️ Faz 4 (guidance) için ATTITUDE/LOCAL_POSITION stream rate ≥50Hz ayarı buraya eklenecek (SAD §8).
